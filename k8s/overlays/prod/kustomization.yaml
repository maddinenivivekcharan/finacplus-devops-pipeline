apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
labels:
  - pairs:
      app.kubernetes.io/part-of: finacplus-assignment
      app.kubernetes.io/version: prod
    includeSelectors: true
configMapGenerator:
  - name: finacplus-devops-config
    behavior: merge
    literals:
      - APP_ENV=prod
images:
  - name: registry.example.com/finacplus/devops-pipeline
    newTag: prod
patches:
  - path: patch-replicas.yaml
