apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
labels:
  - pairs:
      app.kubernetes.io/part-of: finacplus-assignment
      app.kubernetes.io/version: dev
    includeSelectors: true
configMapGenerator:
  - name: finacplus-devops-config
    behavior: merge
    literals:
      - APP_ENV=dev
images:
  - name: registry.example.com/finacplus/devops-pipeline
    newTag: dev
patches:
  - path: patch-replicas.yaml
  - path: patch-hpa.yaml
