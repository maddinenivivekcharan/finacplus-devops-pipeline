apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: finacplus-devops-pipeline
  namespace: finacplus-devops
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: finacplus-devops-pipeline
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
